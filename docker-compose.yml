services:
  db:
    image: postgres:16
    container_name: project_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: projectdb
      POSTGRES_USER: projectuser
      POSTGRES_PASSWORD: supersecret
    ports:
      - "5432:5432"
    volumes:
      - project_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectuser -d projectdb"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  project_data: